# The CI gates for a strict Rust repository: the same commands the README
# runs, and nothing else. Adapt the system package list when the dependency
# graph links GUI libs (WebKitGTK classes); a `--no-deps` doc build still
# compiles dependency build scripts, which is why the doc job carries them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (channel, components incl.
      # llvm-tools-preview) on the first cargo call; no toolchain step needed.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Coverage gate
        run: cargo llvm-cov --workspace --fail-under-lines 95

  doc-comments:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The doc-quality lints are rustdoc's and fire under no other step.
      - run: cargo doc --workspace --no-deps
