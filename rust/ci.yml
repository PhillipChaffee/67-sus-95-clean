# The CI gates for a strict Rust repository: the same commands the README
# runs, and nothing else. Adapt the system package list when the dependency
# graph links GUI libs (WebKitGTK classes); a `--no-deps` doc build still
# compiles dependency build scripts, which is why the doc job carries them.
permissions:
  contents: read  # least privilege: no step in this workflow writes to the repo (GitHub secure-use reference)
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # bounds a hung network gate; GitHub's default is 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # rustup reads rust-toolchain.toml (channel, components incl.
      # llvm-tools-preview) on the first cargo call; no toolchain step needed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Gate AND report in one pass: llvm-cov writes the report before it
      # evaluates the fail-under switches (lines, regions, functions), so the
      # upload below can still run on a gate failure (measured: exit 1 with
      # lcov.info on disk).
      - name: Coverage gate (lines, regions, functions — 95 each)
        run: cargo llvm-cov --workspace --fail-under-lines 95 --fail-under-regions 95 --fail-under-functions 95 --lcov --output-path lcov.info
      # Free for public repositories, no account and no secret: the action
      # takes the built-in GITHUB_TOKEN. Pinned action version. The lcov
      # format is Coveralls' native one.
      # The badge is not a gate: a coveralls.io flake must not redden an
      # otherwise-green build.
      - name: Upload coverage to Coveralls
        if: always()
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2
        with:
          file: lcov.info

  doc-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # bounds a hung network gate; GitHub's default is 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      # The doc-quality lints are rustdoc's and fire under no other step.
      - run: cargo doc --workspace --no-deps

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # bounds a hung network gate; GitHub's default is 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # Pinned hygiene tools: one download per tool, no installer actions.
          # Every download is checksum-verified where the project publishes
          # checksums (lychee, gitleaks, osv-scanner, actionlint, cargo-deny);
          # the rest pin by release tag because no checksum asset is published
          # upstream (typos, shellcheck, shfmt, markdownlint, cargo-mutants) —
          # the recorded residual risk, reviewed on every pin bump. Every curl
          # is bounded (--connect-timeout/--max-time) so a hung download cannot
          # stall the job to GitHub's 360-minute default. Registry installs
          # (npm global) are version-pinned and run with --ignore-scripts
          # (markdownlint-cli2 and jscpd ship no install scripts); the python
          # tools (where present) install from the hash-pinned lockfile, so no
          # transitive dependency resolves live. yamllint is the one explicit
          # exception: GPL-3.0-or-later, deliberately excluded from the
          # permissive-only lockfile, installed by exact pin.
          TYPOS_VERSION=1.50.1
          mkdir /tmp/typosx && curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp/typosx
          sudo mv /tmp/typosx/typos /usr/local/bin/
          npm install -g --ignore-scripts markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz.sha256" -o /tmp/lychee.sha256
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/lychee.tar.gz
          echo "$(awk '{print $1}' /tmp/lychee.sha256)  /tmp/lychee.tar.gz" | sha256sum --check --status
          mkdir /tmp/lycheex && tar xz -C /tmp/lycheex -f /tmp/lychee.tar.gz
          sudo mv /tmp/lycheex/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          GITLEAKS_VERSION=8.30.1
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks.sums
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "$(grep "linux_x64.tar.gz" /tmp/gitleaks.sums | awk '{print $1}')  /tmp/gitleaks.tar.gz" | sha256sum --check --status
          mkdir /tmp/gitleaksx && tar xz -C /tmp/gitleaksx -f /tmp/gitleaks.tar.gz
          sudo mv /tmp/gitleaksx/gitleaks /usr/local/bin/
          npm install -g --ignore-scripts jscpd@5.2.0
          SHELLCHECK_VERSION=0.11.0
          mkdir /tmp/shellcheckx && curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar xJ -C /tmp/shellcheckx
          sudo mv /tmp/shellcheckx/shellcheck-v${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/
          SHFMT_VERSION=3.14.0
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt
          python3 -m pip install --quiet yamllint==1.38.0
          # cargo-deny ships prebuilt musl binaries inside a release subdirectory
          DENY_VERSION=0.20.2
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256" -o /tmp/deny.sha256
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/deny.tar.gz
          echo "$(cat /tmp/deny.sha256)  /tmp/deny.tar.gz" | sha256sum --check --status
          mkdir /tmp/denyx && tar xz -C /tmp/denyx -f /tmp/deny.tar.gz
          sudo mv /tmp/denyx/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/
          ACTIONLINT_VERSION=1.7.12
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o /tmp/actionlint.sums
          echo "$(grep "linux_amd64.tar.gz" /tmp/actionlint.sums | awk '{print $1}')  /tmp/actionlint.tar.gz" | sha256sum --check --status
          mkdir /tmp/actionlintx && tar xz -C /tmp/actionlintx -f /tmp/actionlint.tar.gz
          sudo mv /tmp/actionlintx/actionlint /usr/local/bin/
          # cargo-shear ships prebuilt musl binaries; no checksum asset is
          # published upstream, so it is release-tag-pinned (recorded residual).
          SHEAR_VERSION=1.13.4
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/Boshen/cargo-shear/releases/download/v${SHEAR_VERSION}/cargo-shear-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/cargo-shear-x86_64-unknown-linux-musl/cargo-shear /usr/local/bin/ 2>/dev/null || sudo mv /tmp/cargo-shear /usr/local/bin/
          OSV_VERSION=2.5.1
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_SHA256SUMS" -o /tmp/osv.sums
          echo "$(grep "osv-scanner_linux_amd64" /tmp/osv.sums | awk '{print $1}')  /tmp/osv-scanner" | sha256sum --check --status
          sudo mv /tmp/osv-scanner /usr/local/bin/
          sudo chmod +x /usr/local/bin/osv-scanner
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .
      - name: Secret scan (gitleaks v8.30.1)
        run: gitleaks detect --source . --redact
      - name: Copy-paste detection (jscpd v5.2.0)
        run: jscpd
      - name: Dependency advisories (osv-scanner v2.5.1)
        run: osv-scanner scan -r .
      - name: License check (osv-scanner v2.5.1)
        run: osv-scanner scan -r . --licenses="MIT,Apache-2.0,ISC,BSD-3-Clause,BSD-2-Clause,MPL-2.0,PSF-2.0,Unicode-3.0,Python-2.0,Unlicense,CC0-1.0,0BSD,Apache-1.1,BSD-3-Clause-Clear"
      - name: RustSec advisories (cargo-deny v0.20.2)
        run: cargo deny check advisories
      - name: License policy (cargo-deny v0.20.2)
        run: cargo deny check licenses
      - name: Dependency bans and duplicates (cargo-deny v0.20.2)
        run: cargo deny check bans
      - name: Unused dependencies (cargo-shear v1.13.4)
        run: cargo shear --deny-warnings
      - name: TODO policy (no TODO/FIXME markers in Rust source)
        run: "git grep -nE 'TODO|FIXME' --untracked -- '*.rs' || test $? -eq 1"
      - name: Shell lint (shellcheck v0.11.0)
        run: for sh in $(git ls-files "*.sh"); do shellcheck "$sh"; done
      - name: Shell format (shfmt v3.14.0)
        run: for sh in $(git ls-files "*.sh"); do shfmt -d "$sh"; done
      - name: Workflow YAML lint (yamllint v1.38.0)
        run: yamllint ./.github/workflows/*.yml ./*/ci.yml ./*/mutation.yml
      - name: Workflow lint (actionlint v1.7.12)
        run: actionlint ./.github/workflows/*.yml ./*/ci.yml ./*/mutation.yml
