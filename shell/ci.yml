# The CI gates for a strict shell repository: the same commands the README
# runs, and nothing else. The lint gate runs ShellCheck with no -S flag —
# the default severity is "style", already the strictest setting; passing
# -S anything would loosen the gate.
#
# Download trust anchor: every binary download's sha256 digest is embedded
# here (computed from the exact release asset at pin time and checked
# before extraction), the same model as the shared hygiene block. For
# shellcheck and shfmt the digest is the one the GitHub release API
# records; kcov v42's tarball predates per-asset digests, so its digest
# was computed from the asset itself — the same asset bats-core's own CI
# downloads (kcov v43 publishes no Linux release assets).
permissions:
  contents: read  # least privilege: no step in this workflow writes to the repo (GitHub secure-use reference)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # bounds a hung network gate; GitHub's default is 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pinned tools
        run: |
          # Pinned tools: one download per tool, no installer actions.
          # jq, the coverage gate's coverage.json reader, is runner-preinstalled
          # (the same reliance bats-core's own CI makes).
          SHELLCHECK_VERSION=0.11.0
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum --check --status
          mkdir /tmp/shellcheckx && tar xJ -C /tmp/shellcheckx -f /tmp/shellcheck.tar.xz
          sudo mv /tmp/shellcheckx/shellcheck-v${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/
          SHFMT_VERSION=3.14.0
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /tmp/shfmt
          echo "fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66  /tmp/shfmt" | sha256sum --check --status
          sudo mv /tmp/shfmt /usr/local/bin/
          sudo chmod +x /usr/local/bin/shfmt
          KCOV_VERSION=v42
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/SimonKagstrom/kcov/releases/download/${KCOV_VERSION}/kcov-amd64.tar.gz" -o /tmp/kcov.tar.gz
          echo "78aa17a5f6d27a867cc0540b1550051591d350423a1a0ef98d63c9ce7cc10f9d  /tmp/kcov.tar.gz" | sha256sum --check --status
          mkdir /tmp/kcovx && tar xz -C /tmp/kcovx -f /tmp/kcov.tar.gz
          sudo mv /tmp/kcovx/usr/local/bin/kcov /usr/local/bin/
      # No -S flag: ShellCheck's default severity is style, the strictest.
      # Exit code 1 (any issue at that severity) fails the step.
      - name: Shell lint
        run: for sh in $(git ls-files "*.sh"); do shellcheck "$sh"; done
      # The shfmt man page's own CI pattern; the .editorconfig carries the
      # formatter options (any printer flag would disable them).
      - name: Shell format
        run: shfmt -d .
      - run: ./test/run_tests.sh
      # The gate script keeps kcov's reports on BOTH branches, so a red
      # build still uploads its red coverage and the badge tells the truth.
      - name: Coverage gate
        run: ./coverage-gate.sh
      # Free for public repositories on the built-in GITHUB_TOKEN, no
      # secret. kcov writes cobertura.xml inside its per-run report
      # directories; with no file/files input the Coveralls reporter
      # auto-detects cobertura reports by the **/*/cobertura.xml glob,
      # which matches kcov's layout exactly — format pinned anyway.
      # The badge is not a gate: a coveralls.io flake must not redden an
      # otherwise-green build.
      - name: Upload coverage to Coveralls
        if: always()
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2
        with:
          format: cobertura

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # bounds a hung network gate; GitHub's default is 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # Pinned hygiene tools: one download per tool, no installer actions.
          # Every download's sha256 digest is embedded in this file (computed
          # from the exact release asset at pin time and checked on download).
          # No osv-scanner: it scans dependency lockfiles, a shell repository
          # carries none, and the pinned scanner exits 128 on a manifest-less
          # tree — see the README's accepted gaps for what changes the answer.
          TYPOS_VERSION=1.50.1
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/typos.tar.gz
          echo "edf0545109aee6a22751d04ddecb97c45be47d3aa0409564fb895eeeace91b1e  /tmp/typos.tar.gz" | sha256sum --check --status
          mkdir /tmp/typosx && tar xz -C /tmp/typosx -f /tmp/typos.tar.gz
          sudo mv /tmp/typosx/typos /usr/local/bin/
          npm install -g --ignore-scripts markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/lychee.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  /tmp/lychee.tar.gz" | sha256sum --check --status
          mkdir /tmp/lycheex && tar xz -C /tmp/lycheex -f /tmp/lychee.tar.gz
          sudo mv /tmp/lycheex/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          GITLEAKS_VERSION=8.30.1
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --status
          mkdir /tmp/gitleaksx && tar xz -C /tmp/gitleaksx -f /tmp/gitleaks.tar.gz
          sudo mv /tmp/gitleaksx/gitleaks /usr/local/bin/
          npm install -g --ignore-scripts jscpd@5.2.0
          # yamllint is the one license exception: GPL-3.0-or-later, installed
          # by exact pin (a shell repository carries no lockfile to hash-pin
          # against).
          python3 -m pip install --quiet yamllint==1.38.0
          ACTIONLINT_VERSION=1.7.12
          curl --connect-timeout 10 --max-time 300 -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check --status
          mkdir /tmp/actionlintx && tar xz -C /tmp/actionlintx -f /tmp/actionlint.tar.gz
          sudo mv /tmp/actionlintx/actionlint /usr/local/bin/
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .
      - name: Secret scan (gitleaks v8.30.1)
        run: gitleaks detect --source . --redact
      - name: Copy-paste detection (jscpd v5.2.0)
        run: jscpd
      # The house TODO policy as a fail-closed grep, the same shape the rust
      # folder uses: a TODO or FIXME marker in shell source fails the build,
      # and there is no ignore mechanism — the remedy is to resolve the
      # TODO. The exit code is captured because a plain `||` cannot express
      # the gate: git grep exits 0 on MATCHES, 1 on no matches, and >1 on
      # error, so only "no matches" (1) may pass; matches and errors both
      # stay red. The option order matters: git parses a post-pattern
      # --untracked as a revision (exit 128, verified on git 2.50.1), and
      # --no-recurse-submodules neutralizes a local submodule.recurse=true
      # that would otherwise reject --untracked.
      - name: TODO policy (no TODO/FIXME markers in shell source)
        run: "rc=0; git grep --untracked --no-recurse-submodules -nE 'TODO|FIXME' -- '*.sh' || rc=$?; test \"$rc\" -eq 1"
      - name: Workflow YAML lint (yamllint v1.38.0)
        run: yamllint ./.github/workflows/*.yml ./*/ci.yml
      - name: Workflow lint (actionlint v1.7.12)
        run: actionlint ./.github/workflows/*.yml ./*/ci.yml
