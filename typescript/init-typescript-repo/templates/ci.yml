# The CI gates for a strict TypeScript repository: the same commands the README
# runs, and nothing else. `npm ci` keeps the install deterministic against the
# committed package-lock.json; without that lock the gate is aspirational.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 is the engines floor; 24 is the Active LTS the template is
      # verified against. Pin the major so a runner default cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      # The 95% coverage gate: vitest fails the run under the thresholds
      # configured in vitest.config.ts (all four axes).
      - run: npm test
      # vitest writes coverage/lcov.info (reportOnFailure keeps it on a red
      # build). Free for public repositories, no account and no secret: the
      # action takes the built-in GITHUB_TOKEN. lcov is Coveralls' native
      # format; pinned action version.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # pinned versions; one download per tool, no installer actions
          TYPOS_VERSION=1.50.1
          curl -sSfL "https://github.com/crate-ci/typos/releases/download/v1.50.1/typos-v1.50.1-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv typos /usr/local/bin/
          npm install -g markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/v0.24.2/lychee-v0.24.2-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv lychee /usr/local/bin/
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/
          npm install -g jscpd@5.2.0
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .
      - name: Secret scan (gitleaks v8.30.1)
        run: gitleaks detect --source . --redact
      - name: Copy-paste detection (jscpd v5.2.0)
        run: jscpd

