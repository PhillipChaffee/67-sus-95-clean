# The CI gates for a strict TypeScript repository: the same commands the README
# runs, and nothing else. `npm ci` keeps the install deterministic against the
# committed package-lock.json; without that lock the gate is aspirational.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 is the engines floor; 24 is the Active LTS the template is
      # verified against. Pin the major so a runner default cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      # The 95% coverage gate: vitest fails the run under the thresholds
      # configured in vitest.config.ts (all four axes).
      - run: npm test
      # knip reports unused dependencies, unused exports, and dead files;
      # its entry/project config is knip.jsonc.
      - name: Dependency hygiene (knip v6.35.1)
        run: npm run knip
      # The lockfile policy: the official registry over HTTPS, matching
      # package names, sha512 integrity (reasons in the README).
      - name: Lockfile policy (lockfile-lint v5.0.1)
        run: npm run lint:lockfile
      # The dependency-graph contract: cycles, orphans, and imports of the
      # entry point (rules and reasons in .dependency-cruiser.cjs).
      - name: Dependency graph (dependency-cruiser v18.3.1)
        run: npm run lint:graph
      # vitest writes coverage/lcov.info (reportOnFailure keeps it on a red
      # build). Free for public repositories, no account and no secret: the
      # action takes the built-in GITHUB_TOKEN. lcov is Coveralls' native
      # format; pinned action version.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # pinned versions; one download per tool, no installer actions
          TYPOS_VERSION=1.50.1
          mkdir /tmp/typosx && curl -sSfL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp/typosx
          sudo mv /tmp/typosx/typos /usr/local/bin/
          npm install -g markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          mkdir /tmp/lycheex && curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /tmp/lycheex
          sudo mv /tmp/lycheex/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          GITLEAKS_VERSION=8.30.1
          mkdir /tmp/gitleaksx && curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp/gitleaksx
          sudo mv /tmp/gitleaksx/gitleaks /usr/local/bin/
          npm install -g jscpd@5.2.0
          SHELLCHECK_VERSION=0.11.0
          mkdir /tmp/shellcheckx && curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar xJ -C /tmp/shellcheckx
          sudo mv /tmp/shellcheckx/shellcheck-v${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/
          SHFMT_VERSION=3.14.0
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt
          python3 -m pip install --quiet yamllint==1.38.0
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          sudo mv actionlint /usr/local/bin/
          OSV_VERSION=2.5.1
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .
      - name: Secret scan (gitleaks v8.30.1)
        run: gitleaks detect --source . --redact
      # Trojan Source hygiene: bidi and invisible control characters fail
      # the build. The class bans only the bidi-embedding/override block
      # (U+202A-202E), the bidi isolate/override block (U+2066-2069), the
      # zero-width and direction-mark range (U+200B-200F), invisible math
      # marks (U+2060-2064), the zero-width no-break space / BOM (U+FEFF),
      # the soft hyphen (U+00AD), and Mongolian vowel separator (U+180E):
      # all invisible to a reviewer, all useful for spoofing identifiers.
      # Ordinary non-ASCII text (accented words, emoji) passes.
      - name: Bidi and invisible-character hygiene (grep)
        run: "! grep -rPn \"[\\x{202A}-\\x{202E}\\x{2066}-\\x{2069}\\x{200B}-\\x{200F}\\x{2060}-\\x{2064}\\x{FEFF}\\x{00AD}\\x{180E}]\" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.cjs' --include='*.mjs' --include='*.json' --include='*.md' --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=.git --exclude-dir=stryker-tmp --exclude-dir=mutants ."
      - name: Copy-paste detection (jscpd v5.2.0)
        run: jscpd
      - name: Dependency advisories (osv-scanner v2.5.1)
        run: osv-scanner scan -r .
      - name: License check (osv-scanner v2.5.1)
        run: osv-scanner scan -r . --licenses="MIT,Apache-2.0,ISC,BSD-3-Clause,BSD-2-Clause,MPL-2.0,PSF-2.0,Unicode-3.0,Python-2.0,Unlicense,CC0-1.0,0BSD,Apache-1.1,BSD-3-Clause-Clear"
      - name: Shell lint (shellcheck v0.11.0)
        run: for sh in $(git ls-files "*.sh"); do shellcheck "$sh"; done
      - name: Shell format (shfmt v3.14.0)
        run: for sh in $(git ls-files "*.sh"); do shfmt -d "$sh"; done
      - name: Workflow YAML lint (yamllint v1.38.0)
        run: yamllint ./.github/workflows/*.yml ./*/ci.yml
      - name: Workflow lint (actionlint v1.7.12)
        run: actionlint ./.github/workflows/*.yml ./*/ci.yml
