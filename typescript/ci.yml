# The CI gates for a strict TypeScript repository: the same commands the README
# runs, and nothing else. `npm ci` keeps the install deterministic against the
# committed package-lock.json; without that lock the gate is aspirational.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 is the engines floor; 24 is the Active LTS the template is
      # verified against. Pin the major so a runner default cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      # The 95% coverage gate: vitest fails the run under the thresholds
      # configured in vitest.config.ts (all four axes).
      - run: npm test
      # vitest writes coverage/lcov.info (reportOnFailure keeps it on a red
      # build). Free for public repositories; tokenless uploads work for a
      # public repo on a new org (tokens Not required by default). If the org
      # requires tokens, stash it as CODECOV_TOKEN and pass
      # `token: ${{ secrets.CODECOV_TOKEN }}`. Pinned action version.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov-action@v7
        with:
          files: coverage/lcov.info
