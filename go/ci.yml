# The CI gates for a strict Go repository: the same commands the README runs,
# and nothing else. Keep GOTOOLCHAIN in sync with the `toolchain` line in
# go.mod — the exact pin matters because a newer bundled toolchain would
# otherwise win over a lower go.mod floor and the lint output would drift
# between a local run and CI (go.dev/doc/toolchain).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Any go >= 1.21 bootstraps the pinned toolchain from GOTOOLCHAIN; a
      # runner presence check is unnecessary but `stable` keeps this step
      # working across runner images.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # Pinned install, same command the README documents — no third-party
      # installer action in the supply chain.
      - name: Install golangci-lint (pinned)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go build ./...
      # gofumpt is a gofmt superset, so this check covers gofmt; the
      # formatters section of .golangci.yml is NOT checked by `run` (v2
      # behavior), which is why fmt has its own step.
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - run: golangci-lint run
      - run: go test ./...
      - name: Coverage gate
        run: ./coverage-gate.sh
      # The gate script keeps cover.out on BOTH branches, so a red build still
      # uploads its red coverage and the badge tells the truth. Free for
      # public repositories, no account and no secret: the action takes the
      # built-in GITHUB_TOKEN. Go's native profile format is golang; pinned
      # action version.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: cover.out
          format: golang

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # pinned versions; one download per tool, no installer actions
          TYPOS_VERSION=1.50.1
          curl -sSfL "https://github.com/crate-ci/typos/releases/download/v1.50.1/typos-v1.50.1-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv typos /usr/local/bin/
          npm install -g markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/v0.24.2/lychee-v0.24.2-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv lychee /usr/local/bin/
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .

