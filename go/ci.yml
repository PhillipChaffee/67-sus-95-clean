# The CI gates for a strict Go repository: the same commands the README runs,
# and nothing else. Keep GOTOOLCHAIN in sync with the `toolchain` line in
# go.mod — the exact pin matters because a newer bundled toolchain would
# otherwise win over a lower go.mod floor and the lint output would drift
# between a local run and CI (go.dev/doc/toolchain).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Any go >= 1.21 bootstraps the pinned toolchain from GOTOOLCHAIN; a
      # runner presence check is unnecessary but `stable` keeps this step
      # working across runner images.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # Pinned install, same command the README documents — no third-party
      # installer action in the supply chain.
      - name: Install golangci-lint (pinned)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go build ./...
      # gofumpt is a gofmt superset, so this check covers gofmt; the
      # formatters section of .golangci.yml is NOT checked by `run` (v2
      # behavior), which is why fmt has its own step.
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - run: golangci-lint run
      - run: go test ./...
      - name: Coverage gate
        run: ./coverage-gate.sh
      # The gate script keeps cover.out on BOTH branches, so a red build still
      # uploads its red coverage and the badge tells the truth. Free for
      # public repositories, no account and no secret: the action takes the
      # built-in GITHUB_TOKEN. Go's native profile format is golang; pinned
      # action version.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: cover.out
          format: golang

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # pinned versions; one download per tool, no installer actions
          TYPOS_VERSION=1.50.1
          curl -sSfL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv typos /usr/local/bin/
          npm install -g markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv lychee /usr/local/bin/
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/
          npm install -g jscpd@5.2.0
          OSV_VERSION=2.5.1
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
          SHELLCHECK_VERSION=0.11.0
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar xJ
          sudo mv shellcheck-v${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/
          SHFMT_VERSION=3.14.0
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt
          python3 -m pip install --quiet yamllint==1.38.0
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          sudo mv actionlint /usr/local/bin/
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .
      - name: Secret scan (gitleaks v8.30.1)
        run: gitleaks detect --source . --redact
      - name: Copy-paste detection (jscpd v5.2.0)
        run: jscpd
      - name: Dependency advisories (osv-scanner v2.5.1)
        run: osv-scanner scan -r .
      - name: License check (osv-scanner v2.5.1)
        run: osv-scanner scan -r . --licenses="MIT,Apache-2.0,ISC,BSD-3-Clause,BSD-2-Clause"
      - name: Shell lint (shellcheck v0.11.0)
        run: for sh in $(git ls-files "*.sh"); do shellcheck "$sh"; done
      - name: Shell format (shfmt v3.14.0)
        run: for sh in $(git ls-files "*.sh"); do shfmt -d "$sh"; done
      - name: Workflow YAML lint (yamllint v1.38.0)
        run: yamllint ./.github/workflows/*.yml ./*/ci.yml
      - name: Workflow lint (actionlint v1.7.12)
        run: actionlint ./.github/workflows/*.yml ./*/ci.yml
      - name: Lockfile integrity (hash-pinned install)
        run: pip install --require-hashes --dry-run -r requirements-lock.txt
