# The CI gates for a strict Python repository: the same commands the README
# runs, on the same pinned tools, and nothing else.
#
# Every tool here fails the job by its own exit code — ruff and mypy exit
# nonzero on any diagnostic, and pytest exits nonzero when coverage's
# fail_under (in pyproject.toml) is unmet. There is no warn-to-error
# arithmetic to maintain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the requires-python floor: every gate below must hold on it
          cache: pip
      # The exact pins the README commands assume; a bumped pin re-runs the
      # local gates and lands in the same commit as the version strings here.
      - run: >-
          python -m pip install "ruff==0.16.6" "mypy==2.3.1"
          "pytest==9.1.1" "pytest-cov==7.1.0" "coverage[toml]==7.16.0"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - name: Coverage gate (fail_under = 95, from pyproject.toml)
        run: pytest
      # pytest-cov writes coverage.xml before it evaluates fail_under, so the
      # upload below still runs on a red gate and the badge tells the truth.
      # Free for public repositories, no account and no secret: the action
      # takes the built-in GITHUB_TOKEN. coverage.xml is the cobertura
      # format; pinned action version.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned hygiene tools
        run: |
          # pinned versions; one download per tool, no installer actions
          TYPOS_VERSION=1.50.1
          mkdir /tmp/typosx && curl -sSfL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp/typosx
          sudo mv /tmp/typosx/typos /usr/local/bin/
          npm install -g markdownlint-cli2@0.23.2
          LYCHEE_VERSION=0.24.2
          mkdir /tmp/lycheex && curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /tmp/lycheex
          sudo mv /tmp/lycheex/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          GITLEAKS_VERSION=8.30.1
          mkdir /tmp/gitleaksx && curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp/gitleaksx
          sudo mv /tmp/gitleaksx/gitleaks /usr/local/bin/
          npm install -g jscpd@5.2.0
          SHELLCHECK_VERSION=0.11.0
          mkdir /tmp/shellcheckx && curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar xJ -C /tmp/shellcheckx
          sudo mv /tmp/shellcheckx/shellcheck-v${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/
          SHFMT_VERSION=3.14.0
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt
          python3 -m pip install --quiet yamllint==1.38.0
          python3 -m pip install --quiet deptry==0.25.1
          python3 -m pip install --quiet vulture==2.16
          python3 -m pip install --quiet import-linter==2.15
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          sudo mv actionlint /usr/local/bin/
          OSV_VERSION=2.5.1
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
      - name: Spell check (typos v1.50.1)
        run: typos
      - name: Markdown lint (markdownlint-cli2 v0.23.2)
        run: markdownlint-cli2 "**/*.md"
      - name: Link check (lychee v0.24.2)
        run: lychee --no-progress .
      - name: Secret scan (gitleaks v8.30.1)
        run: gitleaks detect --source . --redact
      - name: Copy-paste detection (jscpd v5.2.0)
        run: jscpd
      - name: Dependency advisories (osv-scanner v2.5.1)
        run: osv-scanner scan -r .
      - name: License check (osv-scanner v2.5.1)
        run: osv-scanner scan -r . --licenses="MIT,Apache-2.0,ISC,BSD-3-Clause,BSD-2-Clause,MPL-2.0,PSF-2.0,Unicode-3.0,Python-2.0,Unlicense,CC0-1.0,0BSD,Apache-1.1,BSD-3-Clause-Clear"
      - name: Shell lint (shellcheck v0.11.0)
        run: for sh in $(git ls-files "*.sh"); do shellcheck "$sh"; done
      - name: Shell format (shfmt v3.14.0)
        run: for sh in $(git ls-files "*.sh"); do shfmt -d "$sh"; done
      - name: Workflow YAML lint (yamllint v1.38.0)
        run: yamllint ./.github/workflows/*.yml ./*/ci.yml
      - name: Workflow lint (actionlint v1.7.12)
        run: actionlint ./.github/workflows/*.yml ./*/ci.yml
      - name: Unused dependencies (deptry v0.25.1)
        run: deptry .
      - name: Dead code (vulture v2.16)
        run: vulture your_package vulture-allowlist.py
      - name: Import layers (import-linter v2.15)
        run: lint-imports
      - name: Lockfile integrity (hash-pinned install)
        run: pip install --require-hashes --dry-run -r requirements-lock.txt
